# Woodpecker pipeline for the slim Suwayomi-Server engine.
#
# `build-and-push` is Eran's template from his other projects, used as the base: plugins/docker,
# privileged, the shared `tools-net` network, registry/repo/credentials from Woodpecker secrets,
# `insecure: true` (this registry is HTTPS with a self-signed certificate -- HTTP/2, plain Basic auth
# on the /v2/ API, no token service), pushing `latest` and the commit sha.
#
# What this repo adds around it:
#   * testing BEFORE the build, because a release must prove itself first;
#   * one step AFTER it, `tag-engine-identity`, for the two tags that identify the ENGINE (the date and
#     Suwayomi's commit). Those are computed at run time and a plugin's `settings` are static YAML --
#     Woodpecker substitutes ${VAR} in this file itself, so a computed value cannot reach `tags:`.
#     That step does not rebuild anything: it copies the manifest the build just pushed to the two
#     extra tag names over the registry API.
#
# The engine version is not pinned here. Each run resolves the newest Suwayomi release, verifies the jar
# against that release's own Checksums.sha256, and writes the result to engine.env -- the SAME file the
# Dockerfile reads from the build context, so the image cannot carry an engine the tests did not run
# against, and the tags cannot describe an engine the image does not contain.
#
# ⚠️ In `commands`, use bare $VAR and never ${VAR}: Woodpecker substitutes ${VAR} in the config itself
# before the script runs, so ${TAG} arrives empty while $TAG in the same script is intact.

networks:
  shared-net:
    name: tools-net
    external: true

steps:
  # ---------------------------------------------------------------------------------------------
  # 1. what are we building? newest engine release, its commit, and the jar hash from upstream.
  #    Written to engine.env, which is in the build context.
  # ---------------------------------------------------------------------------------------------
  resolve-engine:
    image: alpine:3.21
    commands:
      - apk add --no-cache curl git jq >/dev/null
      - |
        set -eu
        TAG=$(curl -fsSL https://api.github.com/repos/Suwayomi/Suwayomi-Server/releases/latest | jq -r .tag_name)
        [ -n "$TAG" ] && [ "$TAG" != "null" ] || { echo "could not resolve the newest Suwayomi release"; exit 1; }
        SUM=$(curl -fsSL "https://github.com/Suwayomi/Suwayomi-Server/releases/download/$TAG/Checksums.sha256" \
              | awk '/\.jar$/ {print $1}' | head -1)
        [ -n "$SUM" ] || { echo "no jar checksum in the $TAG release"; exit 1; }
        # dereference the tag to its commit; annotated tags need the ^{} suffix
        SHA=$(git ls-remote https://github.com/Suwayomi/Suwayomi-Server.git "refs/tags/$TAG^{}" | cut -c1-8)
        [ -n "$SHA" ] || SHA=$(git ls-remote https://github.com/Suwayomi/Suwayomi-Server.git "refs/tags/$TAG" | cut -c1-8)
        [ -n "$SHA" ] || { echo "could not resolve $TAG to a commit"; exit 1; }
        {
          echo "ENGINE_VERSION=$TAG"
          echo "ENGINE_SHA256=$SUM"
          echo "ENGINE_SHA=$SHA"
          echo "ENGINE_DATE=$(date -u +%F)"
        } > engine.env
        echo "engine under test:"; cat engine.env
    when:
      - event: push
        branch: [main, V2]
      - event: cron

  # ---------------------------------------------------------------------------------------------
  # 2. fetch the jar once, hash-checked exactly as the Dockerfile checks it, and keep it in the
  #    workspace for the test steps (the workspace is shared between steps)
  # ---------------------------------------------------------------------------------------------
  fetch-engine:
    image: alpine:3.21
    commands:
      - apk add --no-cache curl >/dev/null
      - |
        set -eu
        . ./engine.env
        mkdir -p .cache
        curl -fsSL -o .cache/engine.jar \
          "https://github.com/Suwayomi/Suwayomi-Server/releases/download/$ENGINE_VERSION/Suwayomi-Server-$ENGINE_VERSION.jar"
        echo "$ENGINE_SHA256  .cache/engine.jar" | sha256sum -c -
        ls -l .cache/engine.jar
    when:
      - event: push
        branch: [main, V2]
      - event: cron

  # ---------------------------------------------------------------------------------------------
  # 3. prove the engine works. It runs as an ordinary process in the step -- the same jar the image
  #    carries, started through the same entrypoint.sh with the same configuration environment -- so
  #    this needs no Docker daemon, no socket and no `volumes` trust.
  # ---------------------------------------------------------------------------------------------
  test-engine:
    image: eclipse-temurin:25.0.4_7-jre-noble
    commands:
      - apt-get update -qq && apt-get install -y -qq --no-install-recommends curl jq ca-certificates >/dev/null
      - |
        set -eu
        mkdir -p /local && cp -r test/fixtures/local-library/. /local/
        LOCAL_SOURCE_PATH=/local \
        FLARESOLVERR_ENABLED=true \
        FLARESOLVERR_URL=http://127.0.0.1:8191 \
        JAR="$PWD/.cache/engine.jar" \
          sh entrypoint.sh > /tmp/engine.log 2>&1 &
        echo "engine starting as pid $!"
      - sh test/check-engine.sh http://127.0.0.1:4567 hard
      - echo "--- engine log (tail) ---"; tail -5 /tmp/engine.log
    when:
      - event: push
        branch: [main, V2]
      - event: cron

  # ---------------------------------------------------------------------------------------------
  # 4. THE BASE: Eran's template. Builds the Dockerfile and pushes it. The Dockerfile needs no build
  #    arguments -- it reads engine.env, which the resolve step wrote into the context.
  # ---------------------------------------------------------------------------------------------
  build-and-push:
    image: plugins/docker
    privileged: true
    networks:
      - shared-net
    settings:
      registry:
        from_secret: docker_registry
      repo:
        from_secret: docker_image
      insecure: true
      dockerfile: Dockerfile
      context: .
      tags:
        - latest
        - "${CI_COMMIT_SHA:0:8}"
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
    when:
      - event: push
        branch: [main, V2]
      - event: cron

  # ---------------------------------------------------------------------------------------------
  # 5. the two tags that identify the ENGINE. No rebuild: the manifest the build just pushed is copied
  #    to the extra tag names. The values come from engine.env -- the same file the build used.
  # ---------------------------------------------------------------------------------------------
  tag-engine-identity:
    image: alpine:3.21
    commands:
      - apk add --no-cache curl >/dev/null
      - |
        set -eu
        . ./engine.env
        [ -n "${ENGINE_DATE:-}" ] && [ -n "${ENGINE_SHA:-}" ] || { echo "engine.env is empty -- refusing to tag"; exit 1; }
        REPO="${IMAGE#$REGISTRY/}"
        API="https://$REGISTRY/v2/$REPO/manifests"
        ACCEPT='application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json'
        echo "registry $REGISTRY, repo $REPO"
        DIGEST=$(curl -sk -u "$REGISTRY_USER:$REGISTRY_PASSWORD" -H "Accept: $ACCEPT" -D - -o /dev/null \
                 "$API/latest" | tr -d '\r' | awk 'tolower($1)=="docker-content-digest:" {print $2}')
        [ -n "$DIGEST" ] || { echo "could not read the digest of :latest from the registry"; exit 1; }
        echo "latest is $DIGEST"
        CT=$(curl -sk -u "$REGISTRY_USER:$REGISTRY_PASSWORD" -H "Accept: $ACCEPT" \
             -o /tmp/manifest.json -w '%{content_type}' "$API/$DIGEST")
        [ -s /tmp/manifest.json ] || { echo "could not fetch the manifest of :latest"; exit 1; }
        echo "manifest content-type: $CT"
        for TAG in "$ENGINE_DATE" "$ENGINE_SHA"; do
          code=$(curl -sk -u "$REGISTRY_USER:$REGISTRY_PASSWORD" -X PUT -H "Content-Type: $CT" \
                 --data-binary @/tmp/manifest.json -o /tmp/put.out -w '%{http_code}' "$API/$TAG")
          echo "  $REPO:$TAG -> HTTP $code"
          [ "$code" = "201" ] || { echo "tagging $TAG failed:"; cat /tmp/put.out; exit 1; }
        done
        echo "published $REPO as latest, $ENGINE_SHA and $ENGINE_DATE"
    environment:
      IMAGE:
        from_secret: docker_image
      REGISTRY:
        from_secret: docker_registry
      REGISTRY_USER:
        from_secret: docker_username
      REGISTRY_PASSWORD:
        from_secret: docker_password
    when:
      - event: push
        branch: [main, V2]
      - event: cron

  # ---------------------------------------------------------------------------------------------
  # 6. Advisory, and last on purpose: a real extension against a real site. Sites go down, rate-limit
  #    and Cloudflare-block CI IPs, and extensions get retired upstream -- none of that is a regression
  #    here, so this step can never fail the release, and it must not delay it either.
  # ---------------------------------------------------------------------------------------------
  test-live-sources:
    image: eclipse-temurin:25.0.4_7-jre-noble
    commands:
      - apt-get update -qq && apt-get install -y -qq --no-install-recommends curl jq ca-certificates >/dev/null
      - |
        set -eu
        mkdir -p /local && cp -r test/fixtures/local-library/. /local/
        LOCAL_SOURCE_PATH=/local \
        FLARESOLVERR_ENABLED=true \
        FLARESOLVERR_URL=http://127.0.0.1:8191 \
        JAR="$PWD/.cache/engine.jar" \
          sh entrypoint.sh > /tmp/engine.log 2>&1 &
        echo "engine starting as pid $!"
      - sh test/check-engine.sh http://127.0.0.1:4567 hard >/dev/null
      - sh test/check-engine.sh http://127.0.0.1:4567 site || echo "(no source answered -- advisory, not a failure)"
    failure: ignore
    when:
      - event: push
        branch: [main, V2]
      - event: cron
