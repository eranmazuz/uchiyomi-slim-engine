# Woodpecker pipeline for the slim Suwayomi-Server engine.
#
# Two triggers, both on main: a push, and the weekly cron. Every run builds the image, proves it works,
# and only then publishes it -- so a run that fails the test leaves `latest` on the last image that
# passed, and a bad engine can be stepped back by date.
#
# The engine version is NOT pinned here. Each run resolves the newest Suwayomi release, verifies the jar
# against that release's own Checksums.sha256, and tags the image three ways:
#   latest                    whatever last passed
#   <YYYY-MM-DD>              the day of the run
#   <suwayomi-commit-sha>     which engine commit this actually is (short)
#
# Those tags identify the ENGINE, not this repo: the image *is* the engine.
#
# Steps run serially in the order written, and a failure stops the pipeline, so the order IS the
# guarantee: build -> test -> push.
#
# `when` is written on every step rather than once at the top, because the semantics differ: a step's
# `when` is a list of conditions that OR together, while the workflow-level block requires all of them
# to hold -- a "push-to-main OR cron" list up there would never match at all.
#
# ⚠️ In a step's `commands`, use bare $VAR and never ${VAR}: Woodpecker substitutes ${VAR} in the
# config itself before the script runs, so ${TAG} arrives empty while $TAG in the same script is intact.

steps:
  # ---------------------------------------------------------------------------------------------
  # 1. what are we building? newest engine release, its commit, and the jar hash from upstream
  # ---------------------------------------------------------------------------------------------
  resolve-engine:
    image: alpine:3.21
    commands:
      - apk add --no-cache curl git jq >/dev/null
      - |
        set -eu
        TAG=$(curl -fsSL https://api.github.com/repos/Suwayomi/Suwayomi-Server/releases/latest | jq -r .tag_name)
        [ -n "$TAG" ] && [ "$TAG" != "null" ] || { echo "could not resolve the newest Suwayomi release"; exit 1; }
        # NOTE: bare $VAR only, never ${VAR}. Woodpecker substitutes ${VAR} in the config itself,
        # before the script runs, so ${TAG} arrives empty (measured: it produced download//Checksums.sha256
        # and a 404 while $TAG in the same script held the right value).
        SUM=$(curl -fsSL "https://github.com/Suwayomi/Suwayomi-Server/releases/download/$TAG/Checksums.sha256" \
              | awk '/\.jar$/ {print $1}' | head -1)
        [ -n "$SUM" ] || { echo "no jar checksum in the $TAG release"; exit 1; }
        # dereference the tag to its commit; annotated tags need the ^{} suffix
        SHA=$(git ls-remote https://github.com/Suwayomi/Suwayomi-Server.git "refs/tags/$TAG^{}" | cut -c1-8)
        [ -n "$SHA" ] || SHA=$(git ls-remote https://github.com/Suwayomi/Suwayomi-Server.git "refs/tags/$TAG" | cut -c1-8)
        [ -n "$SHA" ] || { echo "could not resolve $TAG to a commit"; exit 1; }
        {
          echo "ENGINE_VERSION=$TAG"
          echo "ENGINE_SHA256=$SUM"
          echo "ENGINE_SHA=$SHA"
          echo "ENGINE_DATE=$(date -u +%F)"
        } > engine.env
        echo "engine under test:"; cat engine.env
    when:
      - event: push
        branch: main
      - event: cron

  # ---------------------------------------------------------------------------------------------
  # 2. build on the agent's own daemon -- not inside the plugin container -- so the test steps can
  #    actually run the image afterwards
  # ---------------------------------------------------------------------------------------------
  build:
    image: docker:29-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      IMAGE:
        from_secret: docker_image
    commands:
      - . ./engine.env
      - docker build
        --build-arg ENGINE_VERSION="$ENGINE_VERSION"
        --build-arg ENGINE_SHA256="$ENGINE_SHA256"
        --label org.opencontainers.image.version="$ENGINE_VERSION"
        --label suwayomi.commit="$ENGINE_SHA"
        -t "$IMAGE:latest" -t "$IMAGE:$ENGINE_DATE" -t "$IMAGE:$ENGINE_SHA" .
    when:
      - event: push
        branch: main
      - event: cron

  # ---------------------------------------------------------------------------------------------
  # 3. prove it works before anything is published
  # ---------------------------------------------------------------------------------------------
  test-engine:
    image: docker:29-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      IMAGE:
        from_secret: docker_image
    commands:
      - . ./engine.env
      - sh test/ci-smoke.sh "$IMAGE:$ENGINE_SHA" up
      - sh test/ci-smoke.sh "$IMAGE:$ENGINE_SHA" hard
    when:
      - event: push
        branch: main
      - event: cron

  # Advisory: a real extension against a real site. Sites go down, rate-limit and Cloudflare-block CI
  # IPs, and extensions get retired upstream -- none of that is a regression in this image, so this
  # step is never allowed to fail the release.
  test-live-sources:
    image: docker:29-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      IMAGE:
        from_secret: docker_image
    failure: ignore
    commands:
      - . ./engine.env
      - sh test/ci-smoke.sh "$IMAGE:$ENGINE_SHA" site
    when:
      - event: push
        branch: main
      - event: cron

  # ---------------------------------------------------------------------------------------------
  # TEMPORARY diagnostic, removed once the registry path is proven: does the agent's own docker
  # daemon accept this registry (its other repos use plugins/docker, which brings its own daemon and
  # handles `insecure` itself -- this pipeline deliberately builds on the host daemon so the test
  # step can run the image). Logs in, and reports what the daemon allows. Publishes nothing.
  # ---------------------------------------------------------------------------------------------
  verify-registry-access:
    image: docker:29-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      IMAGE:
        from_secret: docker_image
      REGISTRY:
        from_secret: docker_registry
      REGISTRY_USER:
        from_secret: docker_username
      REGISTRY_PASSWORD:
        from_secret: docker_password
    commands:
      - echo "--- what this daemon considers insecure ---"
      - docker info 2>/dev/null | grep -i -A4 "insecure registries" || echo "(none listed)"
      - echo "--- daemon/API versions ---"
      - docker version --format 'client={{.Client.Version}} server={{.Server.Version}}'
      - echo "--- does the registry answer over HTTP? ---"
      - apk add --no-cache curl >/dev/null 2>&1 || true
      - curl -s -o /dev/null -w 'plain-HTTP GET http://%{remote_ip}:21100/v2/ -> %{http_code}\n' --max-time 10 "http://10.100.102.2:21100/v2/" || echo "plain HTTP failed"
      - echo "--- login with the secret credentials ---"
      - echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin
      - echo "login OK"
    when:
      - event: push
        branch: [main, V2]

  # ---------------------------------------------------------------------------------------------
  # 4. publish all three tags. Reached only if every test above passed.
  # ---------------------------------------------------------------------------------------------
  push:
    image: docker:29-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      IMAGE:
        from_secret: docker_image
      REGISTRY:
        from_secret: docker_registry
      REGISTRY_USER:
        from_secret: docker_username
      REGISTRY_PASSWORD:
        from_secret: docker_password
    commands:
      - . ./engine.env
      - sh test/ci-smoke.sh "$IMAGE:$ENGINE_SHA" down
      - echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin
      - docker push --all-tags "$IMAGE"
    when:
      - event: push
        branch: main
      - event: cron
